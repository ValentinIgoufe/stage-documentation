stages:
  - plumber
  - lint
  - analysis
  - refactor
  - build_base           
  - static_tests
  - build_prod    
  - dynamic_tests      
  - scan    
  - push                          
  - sign  
  - deploy

variables:
  IMAGE_TAG_BUILDER: $CI_REGISTRY_IMAGE/builder:latest
  IMAGE_TAG_SYMFONY_TEMP: $CI_REGISTRY_IMAGE/symfony:temp-$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_SYMFONY_LATEST: $CI_REGISTRY_IMAGE/symfony:latest
  IMAGE_TAG_NGINX_TEST_LATEST: $CI_REGISTRY_IMAGE/nginx/test:latest
  IMAGE_TAG_NGINX_PROD_LATEST: $CI_REGISTRY_IMAGE/nginx/prod:latest
  IMAGE_TAG_NGINX_FINAL: $IMAGE_TAG_NGINX_TEST_LATEST
  IMAGE_TAG_NGINX_TEMP: $CI_REGISTRY_IMAGE/nginx:temp-$CI_COMMIT_SHORT_SHA
  NGINX_CONF: "default-test.conf"
  REGISTRY_URL: gitlab:5005
  COMPOSER_CACHE_DIR: .composer-cache
  PHP_IMAGE: php:8.4-fpm
  APP_ENV: dev

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
      variables:
        NGINX_CONF: "default-prod.conf"
        IMAGE_TAG_NGINX_FINAL: $IMAGE_TAG_NGINX_PROD_LATEST
        APP_ENV: prod
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        APP_ENV: test
      when: always
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always

include:
  - component: $CI_SERVER_FQDN/mon-groupe/plumber/plumber@v0.3.3
    inputs:
      # Compliance
      threshold: 50
      # Job Behavior
      stage: plumber
      gitlab_token: $GITLAB_TOKEN
      # Output
      output_file: plumber-report.json           # Export JSON report
      pbom_file: plumber-pbom.json               # PBOM artifact
      pbom_cyclonedx_file: plumber-cyclonedx-sbom.json  # CycloneDX SBOM (auto-uploaded as a GitLab report)
      print_output: true

# Cache Composer
cache:
  key:
    files:
      - composer.lock
  paths:
    - .composer-cache/
    - vendor/

# Common scripts
.lint_report_setup: &lint_report_setup
  - mkdir -p var/reports

.lint_report_base: &lint_report_base
  artifacts:
    when: always
    paths:
      - var/reports/
    expire_in: 1 week

.docker_compose_cleanup: &docker_compose_cleanup
  - docker compose down --volumes --remove-orphans

# docker hub login
.docker_hub_login_pattern:
  before_script: &docker_hub_login
    - echo "$DOCKER_HUB_PASS" | docker login -u username --password-stdin
    
# Dockerfile lint
hadolint:
  stage: lint
  image: hadolint/hadolint:v2.14.0-alpine
  script:
    - hadolint --ignore=DL3008 --failure-threshold=warning docker/php/Dockerfile

.php_job:
  image: $PHP_IMAGE
  before_script: &init_composer
    - |
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      if [ ! -f "vendor/autoload.php" ]; then
        echo "Cache vide, installation des dépendances..."
        apt-get update && apt-get install -y git unzip
        composer install --no-scripts --no-progress --prefer-dist --ignore-platform-reqs
      else
        echo "Dossier vendor récupéré du cache, on passe l'installation."
        composer dump-autoload --optimize
      fi
    - mkdir -p var/reports

# Pattern for PHP lint jobs with report generation
.php_lint_job:
  extends: .php_job
  <<: *lint_report_base
  allow_failure: true

# Composer Unused (analyse des dépendances non utilisées)
composer_unused:
  extends: .php_job
  stage: lint
  script:
    - |
      if ! command -v curl &> /dev/null; then
        apt-get update && apt-get install -y curl
      fi
    - curl -OL https://github.com/composer-unused/composer-unused/releases/latest/download/composer-unused.phar
    - chmod +x composer-unused.phar
    - php composer-unused.phar
  allow_failure: true

# PHP lint
php-cs-fixer:
  extends: .php_lint_job
  stage: lint
  script:
    - ./vendor/bin/php-cs-fixer fix src 
      --dry-run 
      --diff 
      --config=.php-cs-fixer.dist.php
      --format=gitlab > var/reports/php-cs-fixer.json
  artifacts:
    when: always
    paths:
      - var/reports/php-cs-fixer.json
    reports:
      codequality: var/reports/php-cs-fixer.json
    expire_in: 1 week

# Twig lint
twigcs:
  extends: .php_lint_job
  stage: lint
  script:
    - ./vendor/bin/twigcs 
      --ruleset 'FriendsOfTwig\Twigcs\Ruleset\Official' templates
      --reporter checkstyle > var/reports/twigcs.xml
  artifacts:
    when: always
    paths:
      - var/reports/twigcs.xml
    reports:
      codequality: var/reports/twigcs.xml
    expire_in: 1 week

# SAST : Semgrep 
semgrep:
  stage: analysis
  image: semgrep/semgrep:1.163.0-nonroot
  script:
    - semgrep scan --config=auto --quiet ./src/ ./config/ ./public/

# PHPStan (analyse statique de code)
phpstan:
  extends: .php_lint_job
  stage: analysis
  variables:
    APP_ENV: test
    # fausse url pour juste générer la roadmap du projet
    DATABASE_URL: "sqlite:///:memory:"
    CODE_EDITOR: "none"
  script:
    - mkdir -p var/cache/dev
    # fausse url pour juste générer la roadmap du projet
    - php -d display_errors=0 bin/console debug:container 
      --format=xml > var/cache/dev/App_KernelDevDebugContainer.xml
    - ./vendor/bin/phpstan analyse 
      --configuration=phpstan.neon 
      --memory-limit=1G
      --error-format=gitlab > var/reports/phpstan.json
  artifacts:
    when: always
    paths:
      - var/reports/phpstan.json
    reports:
      codequality: var/reports/phpstan.json
    expire_in: 1 week

# Deptrac (architecture)
deptrac:
  extends: .php_lint_job
  stage: analysis
  script:
    - ./vendor/bin/deptrac analyse 
      --config-file=deptrac.yaml
      --cache-file=var/.deptrac.cache 
      --report-uncovered > var/reports/deptrac.json
  artifacts:
    when: always
    paths:
      - var/reports/deptrac.json
    reports:
      codequality: var/reports/deptrac.json
    expire_in: 1 week

rector_check:
  extends: .php_job
  stage: refactor
  script:
    - |
      set +e
      ./vendor/bin/rector process --config ./rector.php --dry-run --output-format=json > ./rector-report.json
      EXIT_CODE=$?
      set -e
      if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 1 ] || [ $EXIT_CODE -eq 2 ]; then
        exit 0
      else
        exit $EXIT_CODE
      fi

rector_apply:
  extends: .php_job
  stage: refactor
  before_script:
    - *init_composer
    - apt-get update && apt-get install -y git
    - git config --global user.email "bot.gitlab@beauvaisis.fr"
    - git config --global user.name "BOT Gitlab"
    - git remote set-url origin "http://RECTOR-BOT:${BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - git checkout -B rector-fixes-$CI_COMMIT_REF_SLUG
    - ./vendor/bin/rector process --config ./rector.php
    - |
      if [[ -n $(git status --porcelain) ]]; then
        git add ./src/ ./config/ ./public/
        git commit -m "chore(rector): apply rector refactoring [skip ci]"
        git push origin HEAD:rector-fixes-$CI_COMMIT_REF_SLUG \
          -o merge_request.create \
          -o merge_request.title="Refactoring Rector improvements" \
          -o merge_request.remove_source_branch=true --force
      else
        echo "Rector n'a rien trouvé à modifier."
      fi
  needs: ["rector_check"]
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: always

.docker_dind_pattern:
  image: docker:29-cli
  services:
    - name: docker:29.5.2-dind
      command: ["--insecure-registry=gitlab:5005"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_OPTS: "--insecure-registry=gitlab:5005"

# docker dind pattern for cache
.docker_dind_cache_pattern:
  extends: .docker_dind_pattern
  variables:
    DOCKER_BUILDKIT: 1
    CACHE_IMAGE: $CI_REGISTRY_IMAGE/cache:latest
  before_script: &docker_gitlab_and_github_login
    - *docker_hub_login
    - echo "$CI_JOB_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $REGISTRY_URL
    #HTTP
    - |
      echo '[registry."gitlab:5005"]
        http = true
        insecure = true' > /tmp/buildkitd.toml
    - export DOCKER_CONTENT_TRUST=1
    - docker context create buildcontext
    - docker buildx create buildcontext --use 
      --driver docker-container 
      --driver-opt network=host 
      --config /tmp/buildkitd.toml


# BUILD
# img temp qui a les assets compilés etc..
build_base:
  extends: .docker_dind_cache_pattern
  stage: build_base
  script:
    - docker buildx build 
      --pull
      --push
      --target builder 
      --cache-to type=registry,ref=$CACHE_IMAGE,mode=max 
      --cache-from type=registry,ref=$CACHE_IMAGE 
      -t $IMAGE_TAG_BUILDER 
      -f docker/php/Dockerfile .

.static_tests_pattern:
  variables:
    COMPOSE_FILE: docker-compose.yml.ci
  before_script:
    - *docker_hub_login

.dynamic_tests_pattern:
  variables:
    COMPOSE_FILE: docker-compose.yml.test
  before_script:
    - *docker_hub_login

.docker_compose_pull_and_up_pattern:
  script: &docker_compose_pull_and_up
    - echo "$CI_JOB_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $REGISTRY_URL
    - docker compose pull
    - docker compose up -d --wait

.doctrine_migrations_pattern:
  script: &doctrine_migrations
    - docker compose exec -T php php bin/console doctrine:database:create --if-not-exists --env=test
    - docker compose exec -T php php bin/console doctrine:migrations:migrate --no-interaction --env=test
    - docker compose exec -T php php bin/console doctrine:fixtures:load --no-interaction --env=test

.docker_compose_with_migrations_pattern:
  script: &docker_compose_with_migrations
    - *docker_compose_pull_and_up
    - *doctrine_migrations

# ...TESTS sur l'img de build...
phpunit:
  extends: 
    - .docker_dind_pattern
    - .static_tests_pattern
  stage: static_tests
  variables:
    COMPOSE_PROJECT_NAME: "phpunit_${CI_JOB_ID}"
  script:
    - *docker_compose_with_migrations
    - docker compose exec -T -e XDEBUG_MODE=coverage php 
      php vendor/bin/phpunit 
      ./tests
      --cache-result-file=/tmp/.phpunit.result.cache
      --log-junit /tmp/reports/junit.xml 
      --coverage-xml /tmp/reports/coverage-xml
  after_script:
    - docker compose cp php:/tmp/reports/. ./reports/
    - *docker_compose_cleanup
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/phpunit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    expire_in: 1 week

infection_php:
  extends: 
    - .docker_dind_pattern
    - .static_tests_pattern
  stage: static_tests
  variables:
    COMPOSE_PROJECT_NAME: "infection_${CI_JOB_ID}"
  script:
    - *docker_compose_with_migrations
    - docker compose exec -T php ./vendor/bin/infection 
      --threads=4 
      --coverage=reports/coverage.xml 
      --min-msi=20 
      --show-mutations
  after_script:
    - docker compose cp php:/tmp/reports/. ./reports/
    - *docker_compose_cleanup
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week
  needs:
    - job: phpunit
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  allow_failure: true

# ... on utilise le cache du build_base pour build les images hardened de prod
build:
  extends: .docker_dind_cache_pattern
  stage: build_prod
  parallel:
    matrix:
      - IMAGE: [$IMAGE_TAG_SYMFONY_TEMP]
        TARGET: [symfony_runtime] 
      - IMAGE: [$IMAGE_TAG_NGINX_TEMP]
        TARGET: [nginx_runtime]
  before_script:
    - *docker_gitlab_and_github_login
    - apk add --no-cache jq
  script:
    #      --sbom=true
    - |
      if [ "$CI_COMMIT_BRANCH" == "test" ]; then
        CONF_FILE="default-test.conf"
      else
        CONF_FILE="default-prod.conf"
      fi
    - docker buildx build 
      --pull
      --push
      --build-arg NGINX_CONF=$CONF_FILE
      --target $TARGET 
      --cache-from type=registry,ref=$CACHE_IMAGE 
      --attest=type=provenance,mode=max,version=v1
      --output type=image,oci-mediatypes=true
      --metadata-file metadata.json
      -t $IMAGE 
      -f docker/php/Dockerfile .
    - SAFE_NAME=$(echo $IMAGE | tr ':/' '_')
    - IMAGE_DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
    - jq '."buildx.build.provenance"' metadata.json > "provenance_${SAFE_NAME}.json"
    - echo "$IMAGE_DIGEST" > image_digest_${SAFE_NAME}.txt
  artifacts:
    paths:
      - image_digest_*.txt
      - provenance_*.json
    expire_in: 1 week
  needs:
    - job: build_base
      artifacts: false

js_css_tests:
  extends: 
    - .docker_dind_pattern
    - .dynamic_tests_pattern
  stage: dynamic_tests
  variables:
    COMPOSE_PROJECT_NAME: "js_css_tests_${CI_JOB_ID}"
  script:
    - *docker_compose_pull_and_up
    - FIRST_JS=$(docker compose exec -T nginx ls /app/public/build/ | awk '/\.js$/ {print $1; exit}')
    - FIRST_CSS=$(docker compose exec -T nginx ls /app/public/build/ | awk '/\.css$/ {print $1; exit}')
    - docker compose exec -T nginx wget --spider -q -S "http://localhost:8080/build/${FIRST_JS}" > /dev/null
    - docker compose exec -T nginx wget --spider -q -S "http://localhost:8080/build/${FIRST_CSS}" > /dev/null
  after_script:
    - *docker_compose_cleanup
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "test"'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never

# patern for docker image scan
.docker_scan_pattern:
  parallel:
    matrix:
      - IMAGE: [$IMAGE_TAG_SYMFONY_TEMP, $IMAGE_TAG_NGINX_TEMP]

.docker_scan_login: &docker_scan_login
  - echo "$CI_JOB_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $REGISTRY_URL
  - export DOCKER_CONTENT_TRUST=1

.docker_scan_safe_name: &docker_scan_safe_name
  - SAFE_NAME=$(echo $IMAGE | tr ':/' '_')

#
# SCAN : Dockle
dockle:
  extends: .docker_scan_pattern
  stage: scan
  image: 
    name: goodwithtech/dockle:v0.4.15
    entrypoint: [""]
  variables:
    DOCKLE_USERNAME: "$CI_REGISTRY_USER"
    DOCKLE_PASSWORD: "$CI_JOB_TOKEN"
  script:
    # DKL-DI-0005 : dans l'img de PHP officielle, ils n'ont pas exec rm -rf /var/lib/apt/lists
    # et dockle générère une alerte là-dessus /!\
    # Accept key car Nginx a une clé publique dans l'img
    - dockle --ignore DKL-DI-0005 --accept-key KEY_SHA512 --insecure --exit-code 1 --exit-level WARN $IMAGE
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "test"'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# SCAN : Syft (SBOM)
syft:
  extends: .docker_scan_pattern
  stage: scan
  image: 
    name: dhi.io/syft@sha256:5827400e1f8401e8b925687aa38624ada774b5480153ddbe342815a68559b8ef
    entrypoint: [""]
  variables:
    SYFT_REGISTRY_AUTH_USERNAME: "$CI_REGISTRY_USER"
    SYFT_REGISTRY_AUTH_PASSWORD: "$CI_JOB_TOKEN"
    SYFT_REGISTRY_INSECURE_SKIP_TLS_VERIFY: "true"
    SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
  script:
    - *docker_scan_safe_name
    - syft registry:$IMAGE --output cyclonedx-json=sbom-${SAFE_NAME}.json
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^renovate\//
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "test"'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# SCAN : Grype
grype:
  extends: .docker_scan_pattern
  stage: scan
  image: 
    name: cgr.dev/chainguard/grype:latest@sha256:8cd200ecacec175eefd224e1edb8f4c7613ed1cc38650b00ba6f478be2855450
    entrypoint: [""]
  script:
    - *docker_scan_safe_name
    - grype sbom:sbom-${SAFE_NAME}.json 
      --fail-on high 
      --only-fixed 
      --config .grype.yaml
  needs:
    - job: syft
      artifacts: true
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^renovate\//
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "test"'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  allow_failure: true

# patern for push & sign docker image
.docker_push_and_sign_pattern:
  parallel:
    matrix:
      - IMAGE_TEMP: [$IMAGE_TAG_SYMFONY_TEMP]
        IMAGE_LATEST: [$IMAGE_TAG_SYMFONY_LATEST]
      - IMAGE_TEMP: [$IMAGE_TAG_NGINX_TEMP]
        IMAGE_LATEST: [$IMAGE_TAG_NGINX_FINAL]

.docker_login_registry: &docker_login_registry
  - echo "$CI_JOB_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $REGISTRY_URL

.docker_promote_rules: &docker_promote_rules
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "test"'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

.docker_get_image_digest: &docker_get_image_digest
  - SAFE_NAME=$(echo $IMAGE_TEMP | tr ':/' '_')
  - IMAGE_DIGEST=$(cat image_digest_${SAFE_NAME}.txt)
  - REPO_NAME=$(echo $IMAGE_LATEST | cut -d':' -f1-2)
  - IMAGE_WITH_DIGEST="${REPO_NAME}@${IMAGE_DIGEST}"

#
# PROMOTE : Tag :latest SI tests + scans OK
promote:
  extends: 
    - .docker_push_and_sign_pattern
    - .docker_dind_pattern
  stage: push
  variables:
    COMPOSE_PROJECT_NAME: "promote_${CI_JOB_ID}"
  #before_script:
  #  - *docker_hub_login
  script:
    - *docker_login_registry
    - docker pull $IMAGE_TEMP
    - docker tag $IMAGE_TEMP $IMAGE_LATEST
    - docker push $IMAGE_LATEST
    - docker rmi $IMAGE_TEMP
  <<: *docker_promote_rules

# SIGN : Cosign
slsa-attestation:
  extends: .docker_push_and_sign_pattern
  stage: sign
  image: 
    name: cgr.dev/chainguard/cosign:latest@sha256:7a8921f7bb64e832ac0f4ea9ab014ac838b14303b3e19eaf78f4e27aa383af17
    entrypoint: [""]
  script:
    - echo "$CI_JOB_TOKEN" | cosign login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
    # Pour retrouver le digest
    - *docker_get_image_digest
    # key
    - echo "$COSIGN_PRIVATE_KEY" > cosign.key
    # On signe sans Keyless car pas sur GitLab.com
    - cosign sign 
      --yes 
      --allow-http-registry 
      --key cosign.key $IMAGE_WITH_DIGEST
    # Signature de la provenance de BuildKit
    # Étant donné la provenance est collée à mon img (OCID) pas besoin de signer un par un on signe le tout direct
    - cosign attest 
      --yes 
      --allow-http-registry 
      --key cosign.key 
      --type slsaprovenance02 
      --predicate provenance_${SAFE_NAME}.json $IMAGE_WITH_DIGEST
    # Signature du SBOM natif de Buildkit 
    # ne fonctionne sûrement pas car déjà sur le registry...
    # - cosign attest --yes --allow-http-registry --key cosign.key --type spdx $IMAGE_WITH_DIGEST
    # Signature du SBOM de Syft
    - SAFE_NAME_TEMP=$(echo $IMAGE_TEMP | tr ':/' '_')
    - cosign attest 
      --yes --allow-http-registry 
      --key cosign.key 
      --predicate sbom-${SAFE_NAME_TEMP}.json 
      --type cyclonedx $IMAGE_WITH_DIGEST
  after_script:
    - rm -f cosign.key
  <<: *docker_promote_rules
  needs:
    - job: build
      artifacts: true
    - job: syft
      artifacts: true
    - job: promote
      artifacts: false

# DEPLOY
deploy-production:
  stage: deploy
  image: alpine:3.22.4
  environment: production
  before_script:
    - apk add --no-cache curl
    - curl -sL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    # ssh git config...
  script:
    - echo "$CI_JOB_TOKEN" | cosign login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
    - echo "$COSIGN_PUBLIC_KEY" > cosign.pub
    - apk add --no-cache gettext
    # Récupérer les digests depuis les artifacts du build
    - SAFE_NAME_SYMFONY=$(echo $IMAGE_TAG_SYMFONY_TEMP | tr ':/' '_')
    - SAFE_NAME_NGINX=$(echo $IMAGE_TAG_NGINX_TEMP | tr ':/' '_')
    - SYMFONY_DIGEST=$(cat image_digest_${SAFE_NAME_SYMFONY}.txt)
    - NGINX_DIGEST=$(cat image_digest_${SAFE_NAME_NGINX}.txt)
    # Extraire le repo name depuis IMAGE_TAG_SYMFONY_LATEST et IMAGE_TAG_NGINX_FINAL
    - REPO_NAME_SYMFONY=$(echo $IMAGE_TAG_SYMFONY_LATEST | cut -d':' -f1-2)
    - REPO_NAME_NGINX=$(echo $IMAGE_TAG_NGINX_FINAL | cut -d':' -f1-2)
    - SYMFONY_IMAGE_WITH_DIGEST="${REPO_NAME_SYMFONY}@${SYMFONY_DIGEST}"
    - NGINX_IMAGE_WITH_DIGEST="${REPO_NAME_NGINX}@${NGINX_DIGEST}"
    # Vérifier Symfony avec le digest
    - cosign verify --key cosign.pub --allow-http-registry $SYMFONY_IMAGE_WITH_DIGEST   
    - cosign verify-attestation --key cosign.pub --type cyclonedx --allow-http-registry $SYMFONY_IMAGE_WITH_DIGEST > /dev/null
    - cosign verify-attestation --key cosign.pub --type slsaprovenance02 --allow-http-registry $SYMFONY_IMAGE_WITH_DIGEST
    # Vérifier Nginx avec le digest
    - cosign verify --key cosign.pub --allow-http-registry $NGINX_IMAGE_WITH_DIGEST
    - cosign verify-attestation --key cosign.pub --type cyclonedx --allow-http-registry $NGINX_IMAGE_WITH_DIGEST > /dev/null
    - cosign verify-attestation --key cosign.pub --type slsaprovenance02 --allow-http-registry $NGINX_IMAGE_WITH_DIGEST
    - echo "Signature validée ! L'image est authentique et provient de notre pipeline sécurisé."
    # Générer le docker-compose avec digests et déployer
    # A déterminer !!!
    - export SYMFONY_IMAGE_WITH_DIGEST NGINX_IMAGE_WITH_DIGEST
    - envsubst < docker-compose.yml.test > docker-compose.deploy.yml
    - scp docker-compose.deploy.yml deploy@your-prod-server:/path/to/app/
    - ssh deploy@your-prod-server "cd /path/to/app && docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d"
  after_script:
    - rm cosign.pub
  needs:
    - job: build
      artifacts: true
  only:
    - main
    - test
